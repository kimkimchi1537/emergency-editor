<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피난안내도 에디터 (Modular)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- Top Toolbar -->
    <div class="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm z-20 no-print">
        <div class="flex items-center space-x-4">
            <div class="bg-red-600 text-white px-3 py-1 font-bold rounded text-lg shadow flex items-center gap-2">
                <span>🔥</span> 피난안내도 (Modular)
            </div>
            <div class="flex items-center space-x-2 bg-gray-50 p-1 rounded border">
                <input type="text" id="input-name" value="OO빌딩" class="bg-transparent outline-none px-2 w-32 font-medium" placeholder="빌딩명">
                <div class="w-px h-4 bg-gray-300"></div>
                <input type="text" id="input-floor" value="1" class="bg-transparent outline-none px-2 w-12 text-center" placeholder="층">
                <span class="text-sm text-gray-500 pr-2">층</span>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-blue-50 px-3 py-1 rounded-lg border border-blue-100">
                <input type="file" id="file-upload" accept="image/*" hidden>
                <button onclick="document.getElementById('file-upload').click()" class="flex items-center space-x-1 text-blue-700 hover:text-blue-900 text-sm font-medium">
                    <i data-lucide="upload" class="w-4 h-4"></i> <span>도면 깔기</span>
                </button>
                <div id="image-controls" class="hidden flex items-center space-x-2 border-l border-blue-200 pl-2">
                    <i data-lucide="image" class="w-4 h-4 text-blue-400"></i>
                    <input type="range" id="bg-opacity" min="0" max="1" step="0.1" value="0.4" class="w-20 accent-blue-600" title="도면 투명도">
                    <button id="btn-remove-bg" class="text-blue-400 hover:text-red-500"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                </div>
            </div>
            <div class="h-6 w-px bg-gray-300"></div>
            <button id="btn-grid" class="p-2 rounded bg-gray-200 text-black hover:bg-gray-300 transition" title="10cm 격자 켜기/끄기"><i data-lucide="grid" class="w-5 h-5"></i></button>
            <div class="flex items-center space-x-2 text-sm border px-2 py-1 rounded bg-white">
                <i data-lucide="ruler" class="w-4 h-4 text-gray-500"></i>
                <select id="select-paper" class="bg-transparent outline-none cursor-pointer">
                    <option value="A3">A3 (420x297mm)</option>
                    <option value="A4">A4 (297x210mm)</option>
                    <option value="B3">B3 (515x364mm)</option>
                    <option value="B4">B4 (364x257mm)</option>
                </select>
            </div>
            <button id="btn-undo" class="p-2 hover:bg-gray-100 rounded text-gray-600"><i data-lucide="undo" class="w-5 h-5"></i></button>
            <button onclick="window.print()" class="flex items-center space-x-2 bg-gray-800 text-white px-4 py-2 rounded hover:bg-black transition-colors shadow-lg">
                <i data-lucide="printer" class="w-4 h-4"></i> <span>출력</span>
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <div class="w-20 bg-white border-r flex flex-col items-center py-4 space-y-4 shadow-sm z-10 overflow-y-auto no-print">
            <button class="tool-btn active flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="select">
                <i data-lucide="mouse-pointer-2" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">선택</span>
            </button>
            <button class="tool-btn flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="breaker">
                <i data-lucide="scissors" class="w-6 h-6 mb-1 text-orange-500"></i>
                <span class="text-[10px] font-medium">벽 뚫기</span>
            </button>
            <button class="tool-btn flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="eraser">
                <i data-lucide="eraser" class="w-6 h-6 mb-1 text-red-500"></i>
                <span class="text-[10px] font-medium">지우개</span>
            </button>
            <div class="w-10 border-b border-gray-200"></div>
            <button class="tool-btn flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="wall">
                <i data-lucide="minus" class="w-6 h-6 mb-1" style="stroke-width: 4px;"></i>
                <span class="text-[10px] font-medium">벽</span>
            </button>
            <button class="tool-btn flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="rect_wall">
                <i data-lucide="square" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">방</span>
            </button>
            <button class="tool-btn flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="window">
                <i data-lucide="minus" class="w-6 h-6 mb-1 text-blue-400"></i>
                <span class="text-[10px] font-medium">창문</span>
            </button>
            <button class="tool-btn flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="route">
                <i data-lucide="arrow-right" class="w-6 h-6 mb-1 text-green-500"></i>
                <span class="text-[10px] font-medium">동선</span>
            </button>
            <button class="tool-btn flex flex-col items-center justify-center w-14 h-14 rounded-lg border border-transparent transition-all hover:bg-gray-50" data-mode="text">
                <i data-lucide="type" class="w-6 h-6 mb-1"></i>
                <span class="text-[10px] font-medium">글자</span>
            </button>
            <div id="icon-tools" class="flex flex-col space-y-2 w-full px-2 mt-4"></div>
            <div class="text-[10px] text-center text-gray-400 mt-auto pb-4 px-1">
                Drag: 다중 선택<br>Ctrl: 15도 스냅
            </div>
        </div>

        <div class="flex-1 bg-gray-200 overflow-auto p-8 flex justify-center relative" id="workspace">
            <div id="paper-container" class="bg-white shadow-2xl relative transition-all duration-300 print-area origin-top-left">
                <svg id="main-svg" xmlns="http://www.w3.org/2000/svg" class="w-full h-full cursor-default select-none">
                    <defs>
                        <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
                            <polygon points="0 0, 6 2, 0 4" fill="#32CD32" />
                        </marker>
                        <pattern id="grid-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
                            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#BBBBBB" stroke-width="0.5"/>
                        </pattern>
                        <pattern id="grid-pattern-major" width="100" height="100" patternUnits="userSpaceOnUse">
                            <rect width="100" height="100" fill="url(#grid-pattern)" />
                            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#999999" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect id="bg-color" width="100%" height="100%" fill="#FFFACD"></rect>
                    <image id="bg-image-el" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" style="display:none;"></image>
                    <rect id="grid-layer" width="100%" height="100%" fill="url(#grid-pattern-major)" opacity="0.5" pointer-events="none"></rect>
                    
                    <g id="header-group">
                        <rect x="0" y="0" width="100%" height="60" fill="#CC0000"></rect>
                        <text x="30" y="40" fill="white" font-size="32" font-weight="bold" font-family="sans-serif">피난안내도 <tspan font-size="20" font-weight="normal">EVACUATION DIAGRAM</tspan></text>
                        <text id="header-title" x="98%" y="40" fill="white" font-size="24" text-anchor="end" font-weight="bold">OO빌딩 1층</text>
                    </g>
                    <g id="info-sidebar" transform="translate(0, 60)">
                        <rect width="250" height="100%" fill="white"></rect>
                        <line x1="250" y1="0" x2="250" y2="100%" stroke="#ccc"></line>
                        <text x="20" y="40" font-size="18" font-weight="bold" fill="red">화재 시 피난요령</text>
                        <text x="20" y="60" font-size="10" fill="gray">HOW TO EVACUATE</text>
                        <g transform="translate(20, 90)"><circle cx="15" cy="15" r="15" fill="#f3f4f6"></circle><text x="15" y="20" text-anchor="middle" font-weight="bold">1</text><text x="40" y="15" font-weight="bold" font-size="14">불이야! 외치기</text><text x="40" y="28" font-size="10" fill="gray">Shout Fire!</text></g>
                        <g transform="translate(20, 150)"><circle cx="15" cy="15" r="15" fill="#f3f4f6"></circle><text x="15" y="20" text-anchor="middle" font-weight="bold">2</text><text x="40" y="15" font-weight="bold" font-size="14">비상벨 누르기</text><text x="40" y="28" font-size="10" fill="gray">Press Alarm</text></g>
                        <g transform="translate(20, 210)"><circle cx="15" cy="15" r="15" fill="#f3f4f6"></circle><text x="15" y="20" text-anchor="middle" font-weight="bold">3</text><text x="40" y="15" font-weight="bold" font-size="14">낮은 자세 이동</text><text x="40" y="28" font-size="10" fill="gray">Stay Low</text></g>
                        <g transform="translate(20, 270)"><circle cx="15" cy="15" r="15" fill="#f3f4f6"></circle><text x="15" y="20" text-anchor="middle" font-weight="bold">4</text><text x="40" y="15" font-weight="bold" font-size="14">계단으로 대피</text><text x="40" y="28" font-size="10" fill="gray">Use Stairs</text></g>
                        <line x1="20" y1="330" x2="230" y2="330" stroke="#eee"></line>
                        <text x="20" y="360" font-size="18" font-weight="bold" fill="red">소화기 사용요령</text>
                        <g transform="translate(20, 400)"><circle cx="15" cy="15" r="15" fill="#f3f4f6"></circle><text x="15" y="20" text-anchor="middle" font-weight="bold">1</text><text x="40" y="15" font-weight="bold" font-size="14">안전핀 뽑기</text><text x="40" y="28" font-size="10" fill="gray">Pull Pin</text></g>
                        <g transform="translate(20, 460)"><circle cx="15" cy="15" r="15" fill="#f3f4f6"></circle><text x="15" y="20" text-anchor="middle" font-weight="bold">2</text><text x="40" y="15" font-weight="bold" font-size="14">호스 향하기</text><text x="40" y="28" font-size="10" fill="gray">Aim Base</text></g>
                        <g transform="translate(20, 520)"><circle cx="15" cy="15" r="15" fill="#f3f4f6"></circle><text x="15" y="20" text-anchor="middle" font-weight="bold">3</text><text x="40" y="15" font-weight="bold" font-size="14">손잡이 누르기</text><text x="40" y="28" font-size="10" fill="gray">Squeeze</text></g>
                    </g>
                    
                    <g id="merged-wall-layer"></g> 
                    <g id="elements-layer"></g>    
                    <g id="ui-layer"></g>
                    <g id="temp-layer"></g>
                    
                    <g id="legend-group">
                        <rect width="100%" height="50" fill="white" stroke-width="0"></rect>
                        <line x1="0" y1="0" x2="100%" y2="0" stroke="#ccc"></line>
                        <text x="20" y="30" font-weight="bold" font-size="14">범례 (Legend):</text>
                        <g transform="translate(140, 15)" id="legend-items"></g>
                    </g>
                    <circle id="snap-marker" r="4" fill="red" stroke="white" stroke-width="2" style="display:none; pointer-events:none;" />
                </svg>
            </div>
            <div id="snapped-pos-info" class="absolute bottom-4 left-24 px-2 py-1 bg-white border rounded text-[10px] text-blue-600 font-bold pointer-events-none no-print">X: 0, Y: 0</div>
        </div>
    </div>

    <!-- 모듈 로드 -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
