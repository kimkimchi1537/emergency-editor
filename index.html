<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피난안내도 에디터 (Modular)</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; background-color: #282828; color: #fff; font-family: sans-serif; overflow: hidden; }
        #sidebar { width: 70px; background-color: #333; display: flex; flex-direction: column; align-items: center; padding-top: 15px; border-right: 1px solid #1e1e1e; }
        .tool-btn { width: 50px; height: 50px; margin-bottom: 12px; background-color: #444; border: none; color: #ddd; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tool-btn.active { background-color: #0066cc; color: #fff; }
        #workspace-container { flex: 1; display: flex; justify-content: center; align-items: center; background-color: #1a1a1a; }
        #workspace { background-color: #ffffff; width: 800px; height: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: crosshair; }
    </style>
</head>
<body>
    <div id="sidebar">
        <button class="tool-btn active" id="tool-select">선택</button>
        <button class="tool-btn" id="tool-line">선</button>
        <button class="tool-btn" id="tool-rect">사각</button>
        <button class="tool-btn" id="tool-circle">원</button>
        <button class="tool-btn" id="tool-arrow">화살</button>
    </div>
    <div id="workspace-container">
        <svg id="workspace" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#ffca3a" />
                </marker>
            </defs>
        </svg>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
