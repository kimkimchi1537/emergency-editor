<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>피난안내도 에디터</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #282828;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #sidebar {
            width: 70px;
            background-color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            border-right: 1px solid #1e1e1e;
            box-shadow: 2px 0 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .tool-btn {
            width: 50px;
            height: 50px;
            margin-bottom: 12px;
            background-color: #444444;
            border: 2px solid transparent;
            color: #dddddd;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background-color: #555555;
        }
        .tool-btn.active {
            background-color: #0066cc;
            border-color: #66b3ff;
            color: #ffffff;
        }
        #workspace-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            overflow: auto;
            padding: 40px;
        }
        #workspace {
            background-color: #ffffff;
            width: 800px;
            height: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <button class="tool-btn active" id="tool-select">선택</button>
        <button class="tool-btn" id="tool-line">선</button>
        <button class="tool-btn" id="tool-rect">사각</button>
        <button class="tool-btn" id="tool-circle">원</button>
        <button class="tool-btn" id="tool-arrow">화살</button>
    </div>
    <div id="workspace-container">
        <svg id="workspace" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <script>
        console.log("[SYSTEM] 애플리케이션 초기화 시작");

        class Vector2 {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                console.log(`[CLASS Vector2] 인스턴스 생성 (${this.x}, ${this.y})`);
            }
        }

        const state = {
            currentTool: 'select',
            isDrawing: false,
            startX: 0,
            startY: 0,
            currentShapeInfo: null,
            shapes: []
        };

        console.log("[STATE] 초기 상태 설정 완료", state);

        const sidebar = document.getElementById('sidebar');
        const workspace = document.getElementById('workspace');
        let shapeIdCounter = 0;

        console.log("[DOM] 필수 DOM 요소 할당 완료");

        function setupDebugMonitor(appState) {
            console.log("[DEBUG-INIT] 디버그 모니터 셋업 시작");
            
            const monitor = document.createElement('div');
            monitor.id = 'debug-monitor';
            Object.assign(monitor.style, {
                position: 'fixed',
                top: '10px',
                right: '10px',
                width: '350px',
                maxHeight: '85vh',
                backgroundColor: 'rgba(0, 0, 0, 0.85)',
                color: '#00ff00',
                padding: '15px',
                fontSize: '11px',
                fontFamily: 'Consolas, monospace',
                overflowY: 'auto',
                zIndex: '9999',
                border: '1px solid #444',
                borderRadius: '8px',
                display: 'none',
                boxShadow: '0 0 15px rgba(0,0,0,0.5)',
                whiteSpace: 'pre-wrap'
            });

            const header = document.createElement('div');
            header.innerHTML = '<strong style="color: #fff; font-size: 13px;">[DEBUG MONITOR - SHAPES]</strong><hr style="border:0; border-top:1px solid #444; margin: 10px 0;">';
            monitor.appendChild(header);

            const content = document.createElement('div');
            content.id = 'debug-content';
            monitor.appendChild(content);

            document.body.appendChild(monitor);
            console.log("[DEBUG-DOM] 모니터 패널 바디 추가 완료");

            const updateContent = () => {
                const cleanData = JSON.stringify(appState.shapes, (key, value) => {
                    if (key === 'element') return undefined;
                    return value;
                }, 2);
                content.textContent = cleanData;
                console.log(`[DEBUG-REFRESH] 데이터 렌더링 업데이트 (객체수: ${appState.shapes.length})`);
            };

            window.addEventListener('keydown', (e) => {
                if (e.key === 'F1') {
                    e.preventDefault();
                    console.log("[DEBUG-EVENT] F1 키 입력 감지");
                    const isVisible = monitor.style.display !== 'none';
                    monitor.style.display = isVisible ? 'none' : 'block';
                    
                    if (!isVisible) {
                        updateContent();
                    }
                    console.log(`[DEBUG-ACTION] 모니터 가시성 변경: ${!isVisible}`);
                }
            });

            const observer = new Proxy(appState.shapes, {
                set(target, property, value) {
                    const result = Reflect.set(target, property, value);
                    if (monitor.style.display !== 'none') {
                        updateContent();
                    }
                    return result;
                }
            });

            console.log("[DEBUG-SYSTEM] F1 토글 리스너 및 데이터 감시 준비 완료");
            
            setInterval(() => {
                if (monitor.style.display !== 'none') {
                    updateContent();
                }
            }, 500);
        }

        setupDebugMonitor(state);

        sidebar.addEventListener('click', (e) => {
            console.log("[EVENT] 사이드바 클릭", e.target);
            
            if (e.target.classList.contains('tool-btn')) {
                const toolId = e.target.id.replace('tool-', '');
                console.log(`[ACTION] 툴 변경: ${state.currentTool} -> ${toolId}`);
                
                state.currentTool = toolId;
                
                const buttons = document.querySelectorAll('.tool-btn');
                buttons.forEach(btn => btn.classList.remove('active'));
                
                e.target.classList.add('active');
                console.log("[STATE] 상태 업데이트 완료", state.currentTool);
            }
        });

        workspace.addEventListener('mousedown', (e) => {
            if (state.currentTool === 'select') {
                console.log("[ACTION] 현재 선택 툴이므로 드로잉 생략");
                return;
            }

            console.log(`[EVENT] 워크스페이스 mousedown | X: ${e.offsetX}, Y: ${e.offsetY}`);
            
            state.isDrawing = true;
            state.startX = e.offsetX;
            state.startY = e.offsetY;
            shapeIdCounter++;

            const startPoint = new Vector2(e.offsetX, e.offsetY);

            if (state.currentTool === 'line') {
                const endPoint = new Vector2(e.offsetX, e.offsetY);
                
                state.currentShapeInfo = {
                    id: `shape_${shapeIdCounter}`,
                    type: 'line',
                    points: [startPoint, endPoint],
                    element: document.createElementNS('http://www.w3.org/2000/svg', 'line')
                };

                state.currentShapeInfo.element.setAttribute('x1', startPoint.x);
                state.currentShapeInfo.element.setAttribute('y1', startPoint.y);
                state.currentShapeInfo.element.setAttribute('x2', endPoint.x);
                state.currentShapeInfo.element.setAttribute('y2', endPoint.y);
                state.currentShapeInfo.element.setAttribute('stroke', '#e63946');
                state.currentShapeInfo.element.setAttribute('stroke-width', '4');
                state.currentShapeInfo.element.setAttribute('stroke-linecap', 'round');

                console.log("[MEMORY] Line 객체 및 2개의 Vector2 할당", state.currentShapeInfo);
                
            } else if (state.currentTool === 'rect') {
                const pt2 = new Vector2(e.offsetX, e.offsetY);
                const pt3 = new Vector2(e.offsetX, e.offsetY);
                const pt4 = new Vector2(e.offsetX, e.offsetY);

                state.currentShapeInfo = {
                    id: `shape_${shapeIdCounter}`,
                    type: 'rect',
                    points: [startPoint, pt2, pt3, pt4],
                    element: document.createElementNS('http://www.w3.org/2000/svg', 'rect')
                };

                state.currentShapeInfo.element.setAttribute('x', startPoint.x);
                state.currentShapeInfo.element.setAttribute('y', startPoint.y);
                state.currentShapeInfo.element.setAttribute('width', '0');
                state.currentShapeInfo.element.setAttribute('height', '0');
                state.currentShapeInfo.element.setAttribute('stroke', '#1d3557');
                state.currentShapeInfo.element.setAttribute('stroke-width', '4');
                state.currentShapeInfo.element.setAttribute('fill', 'rgba(29, 53, 87, 0.1)');

                console.log("[MEMORY] Rect 객체 및 4개의 Vector2 할당", state.currentShapeInfo);
            } else if (state.currentTool === 'circle') {
                const pt2 = new Vector2(e.offsetX, e.offsetY);
                const pt3 = new Vector2(e.offsetX, e.offsetY);
                const pt4 = new Vector2(e.offsetX, e.offsetY);

                state.currentShapeInfo = {
                    id: `shape_${shapeIdCounter}`,
                    type: 'circle',
                    points: [startPoint, pt2, pt3, pt4],
                    element: document.createElementNS('http://www.w3.org/2000/svg', 'ellipse')
                };

                state.currentShapeInfo.element.setAttribute('cx', startPoint.x);
                state.currentShapeInfo.element.setAttribute('cy', startPoint.y);
                state.currentShapeInfo.element.setAttribute('rx', '0');
                state.currentShapeInfo.element.setAttribute('ry', '0');
                state.currentShapeInfo.element.setAttribute('stroke', '#2a9d8f');
                state.currentShapeInfo.element.setAttribute('stroke-width', '4');
                state.currentShapeInfo.element.setAttribute('fill', 'rgba(42, 157, 143, 0.1)');

                console.log("[MEMORY] Circle 객체 및 4개의 Vector2 할당", state.currentShapeInfo);
            }

            if (state.currentShapeInfo) {
                workspace.appendChild(state.currentShapeInfo.element);
                console.log("[DOM] 생성된 SVG 요소 캔버스에 마운트 완료");
            }
        });

        workspace.addEventListener('mousemove', (e) => {
            if (!state.isDrawing || !state.currentShapeInfo) return;

            console.log(`[EVENT] 워크스페이스 mousemove 드로잉 중 | X: ${e.offsetX}, Y: ${e.offsetY}`);

            if (state.currentShapeInfo.type === 'line') {
                state.currentShapeInfo.points[1].x = e.offsetX;
                state.currentShapeInfo.points[1].y = e.offsetY;

                state.currentShapeInfo.element.setAttribute('x2', e.offsetX);
                state.currentShapeInfo.element.setAttribute('y2', e.offsetY);

                console.log(`[UPDATE] Line 포인트[1] 갱신: (${e.offsetX}, ${e.offsetY})`);
                
            } else if (state.currentShapeInfo.type === 'rect') {
                const minX = Math.min(state.startX, e.offsetX);
                const minY = Math.min(state.startY, e.offsetY);
                const maxX = Math.max(state.startX, e.offsetX);
                const maxY = Math.max(state.startY, e.offsetY);

                state.currentShapeInfo.points[0].x = minX;
                state.currentShapeInfo.points[0].y = minY;
                
                state.currentShapeInfo.points[1].x = maxX;
                state.currentShapeInfo.points[1].y = minY;
                
                state.currentShapeInfo.points[2].x = maxX;
                state.currentShapeInfo.points[2].y = maxY;
                
                state.currentShapeInfo.points[3].x = minX;
                state.currentShapeInfo.points[3].y = maxY;

                state.currentShapeInfo.element.setAttribute('x', minX);
                state.currentShapeInfo.element.setAttribute('y', minY);
                state.currentShapeInfo.element.setAttribute('width', maxX - minX);
                state.currentShapeInfo.element.setAttribute('height', maxY - minY);

                console.log(`[UPDATE] Rect 4개 포인트 동적 갱신 완료 | W: ${maxX - minX}, H: ${maxY - minY}`);
            } else if (state.currentShapeInfo.type === 'circle') {
                const minX = Math.min(state.startX, e.offsetX);
                const minY = Math.min(state.startY, e.offsetY);
                const maxX = Math.max(state.startX, e.offsetX);
                const maxY = Math.max(state.startY, e.offsetY);

                state.currentShapeInfo.points[0].x = minX;
                state.currentShapeInfo.points[0].y = minY;
                
                state.currentShapeInfo.points[1].x = maxX;
                state.currentShapeInfo.points[1].y = minY;
                
                state.currentShapeInfo.points[2].x = maxX;
                state.currentShapeInfo.points[2].y = maxY;
                
                state.currentShapeInfo.points[3].x = minX;
                state.currentShapeInfo.points[3].y = maxY;

                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                const rx = (maxX - minX) / 2;
                const ry = (maxY - minY) / 2;

                state.currentShapeInfo.element.setAttribute('cx', cx);
                state.currentShapeInfo.element.setAttribute('cy', cy);
                state.currentShapeInfo.element.setAttribute('rx', rx);
                state.currentShapeInfo.element.setAttribute('ry', ry);

                console.log(`[UPDATE] Circle 4개 포인트 동적 갱신 완료 | CX: ${cx}, CY: ${cy}, RX: ${rx}, RY: ${ry}`);
            }
        });

        workspace.addEventListener('mouseup', (e) => {
            if (!state.isDrawing) return;
            
            console.log(`[EVENT] 워크스페이스 mouseup | X: ${e.offsetX}, Y: ${e.offsetY}`);

            if (state.currentShapeInfo) {
                state.shapes.push(state.currentShapeInfo);
                console.log(`[MEMORY] 도형 저장소에 커밋 완료. 현재 총 도형 수: ${state.shapes.length}`);
                console.dir(state.shapes);
            }

            state.isDrawing = false;
            state.currentShapeInfo = null;
            console.log("[STATE] 드로잉 상태 종료 및 초기화");
        });

        workspace.addEventListener('mouseleave', (e) => {
            if (state.isDrawing) {
                console.log("[EVENT] 워크스페이스 이탈 - 드로잉 강제 종료");
                if (state.currentShapeInfo) {
                    state.shapes.push(state.currentShapeInfo);
                    console.log(`[MEMORY] 이탈 전 도형 강제 저장 완료 (총 ${state.shapes.length}개)`);
                }
                state.isDrawing = false;
                state.currentShapeInfo = null;
            }
        });

        console.log("[SYSTEM] 모든 초기화 완료 및 대기 상태 진입");
    </script>
</body>
</html>
